---
# Codacy config for Meteograph. Docs: https://docs.codacy.com/repositories-configure/codacy-configuration-file/
# Note: when this file exists, the "Ignored files" settings in the Codacy UI no longer apply.

exclude_paths:
  # Generated / build output — mirrors the old .coderabbit.yaml path filters
  - "lib/l10n/app_localizations*.dart"
  - "lib/generated/**"
  - "**/*.g.dart"
  - "build/**"
  - "android/**/build/**"
  - ".dart_tool/**"
  - "e2e/node_modules/**"
  - "e2e/.appium/**"
  # Local test-harness config: never shipped, never fed external input. The
  # security scanners' taint analysis flags every path.join/fs call here as
  # traversal, but both `base` and `currentTest` go through
  # .replace(/[^a-z0-9]+/gi, '_') first, so "../" cannot survive. Five-plus
  # rules across three tools fire on this one file; excluding it beats
  # disabling each of those patterns repo-wide.
  - "e2e/wdio.conf.js"
